# nginx config for the UI container: serve the Vite SPA bundle and fall back to
# index.html for client-side routes (react-router). API calls are NOT proxied
# here — the bundle hits VITE_API_BASE directly (baked at build time).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets; never cache the entrypoint HTML.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
