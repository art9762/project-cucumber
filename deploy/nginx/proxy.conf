# Фронтовый прокси прод-стека: единственная публичная точка входа.
# TLS терминируется здесь. Без домена используется self-signed-сертификат
# (доступ по IP) — его генерирует deploy.sh в ${REMOTE_DIR}/certs и монтирует
# в /etc/nginx/certs (см. docker-compose.prod.yml).
#   /api/  → analysis:8113 (префикс /api срезается: роуты сервиса без префикса)
#   /      → ui:80 (статический бандл)
# Rate-limit на логин — защита от перебора паролей (см. phase-6 runbook).
#
# При появлении домена: заменить cert на доверенный (Let's Encrypt) и
# раскомментировать HSTS ниже.

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Плейн-HTTP (контейнерный порт 80) → редирект на HTTPS. Реально доступен, только
# если на хосте отдельно опубликован порт→80; при IP-доступе по одному порту,
# смотрящему на 443, не задействован, но оставлен для корректности.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # Базовые security-заголовки.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # HSTS — включать ТОЛЬКО с доверенным сертификатом на домене. На self-signed
    # cert / IP это сломает доступ: браузер запомнит политику и запретит обход
    # предупреждения о сертификате.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Логин — отдельный location с жёстким лимитом.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://analysis:8113/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # Завершающий слэш в proxy_pass срезает префикс /api/.
        proxy_pass http://analysis:8113/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ui:80;
        proxy_set_header Host $host;
    }
}
