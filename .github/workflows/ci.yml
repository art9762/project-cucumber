name: CI

# Lint + type-check + tests for all three services. Analysis uses in-memory
# SQLite; search-engine additionally exercises PostgreSQL-specific upserts and
# schedules in an isolated CI database. External model/API clients are stubbed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analysis:
    name: analysis (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: analysis/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy analysis

      - name: Pytest
        run: pytest -q

  search-engine:
    name: search-engine (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cucumber_test
          POSTGRES_PASSWORD: cucumber_test
          POSTGRES_DB: cucumber_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cucumber_test -d cucumber_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: postgresql+asyncpg://cucumber_test:cucumber_test@localhost:5432/cucumber_test
    defaults:
      run:
        # Directory name contains a space — quoting handled by YAML string.
        working-directory: "search engine"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "search engine/pyproject.toml"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy find_engine

      - name: Pytest
        run: pytest -q

  ui:
    name: ui (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      # `npm run build` runs `tsc --noEmit && vite build` — covers typecheck.
      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit
